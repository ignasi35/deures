<!doctype html>
<html lang="ca">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Comarques de Catalunya</title>
        <style>
            body {
                color: #222;
                font-family: Arial, sans-serif;
                line-height: 1.45;
                margin: 2rem auto;
                max-width: 74rem;
                padding: 0 1rem;
            }

            h1 {
                margin-bottom: 0.25rem;
            }

            .instructions {
                margin-top: 0;
            }

            .worksheet {
                align-items: start;
                display: grid;
                gap: 1.5rem;
                grid-template-columns: minmax(0, 1.5fr) minmax(16rem, 0.8fr);
            }

            figure {
                margin: 0;
            }

            .map {
                display: block;
                height: auto;
                width: 100%;
            }

            figcaption {
                color: #555;
                font-size: 0.8rem;
                margin-top: 0.5rem;
            }

            h2 {
                font-size: 1.2rem;
                margin: 0 0 0.75rem;
            }

            #question-headings,
            #questions li {
                display: grid;
                grid-template-columns: minmax(0, 1.3fr) minmax(0, 1.5fr) minmax(3rem, 0.45fr);
                gap: 0.5rem;
            }

            #question-headings {
                font-size: 0.8rem;
                font-weight: 700;
                margin-bottom: 0.5rem;
            }

            #questions {
                display: grid;
                gap: 0.65rem;
                grid-template-columns: minmax(0, 1fr);
                list-style: none;
                margin: 0;
                padding: 0;
            }

            #questions li {
                align-items: end;
            }

            .answer-space {
                border-bottom: 1px solid #777;
                display: block;
                height: 1.3rem;
            }

            footer {
                font-size: 0.75rem;
                margin-top: 1rem;
            }

            .actions {
                display: flex;
                gap: 0.75rem;
                margin-top: 1.5rem;
            }

            button {
                cursor: pointer;
                font: inherit;
                padding: 0.5rem 1rem;
            }

            @media (max-width: 48rem) {
                .worksheet {
                    grid-template-columns: 1fr;
                }
            }

            @media print {
                @page {
                    size: A4 landscape;
                    margin: 10mm;
                }

                body {
                    color: #000;
                    font-size: 10pt;
                    margin: 0;
                    max-width: none;
                    padding: 0;
                }

                h1 {
                    font-size: 18pt;
                }

                .worksheet {
                    gap: 1rem;
                    grid-template-columns: minmax(0, 1.5fr) minmax(0, 0.8fr);
                }

                .map {
                    margin: 0 auto;
                    width: 90%;
                }

                #questions {
                    gap: 0.35rem;
                }

                #question-headings {
                    margin-bottom: 0.3rem;
                }

                #questions li {
                    break-inside: avoid;
                }

                .actions {
                    display: none;
                }

                .index-link {
                    display: none;
                }

                footer {
                    font-size: 7pt;
                    margin-top: 0.5rem;
                }

                figcaption {
                    font-size: 7pt;
                }

                .full-list-link {
                    display: none;
                }
            }
        </style>
    </head>
    <body>
        <main>
            <p class="index-link"><a href="../index.html">Torna a l’índex</a></p>
            <h1>Comarques de Catalunya</h1>
            <p class="instructions" id="quiz-instructions"></p>
            <p class="full-list-link"><a href="llistat.html">llistat complert</a></p>
            <div class="worksheet">
                <figure>
                    <img
                        class="map"
                        src="comarques-catalunya-map.svg"
                        alt="Mapa de Catalunya amb els límits de les 43 comarques, cadascuna identificada amb un número."
                    >
                    <figcaption>
                        Límits comarcals basats en dades de la Generalitat de Catalunya,
                        distribuïdes pel projecte
                        <a href="https://github.com/psauleda/Comarques-de-Catalunya">Comarques de Catalunya</a>.
                    </figcaption>
                </figure>
                <section aria-labelledby="quiz-title">
                    <h2 id="quiz-title"></h2>
                    <div id="question-headings"></div>
                    <ol id="questions"></ol>
                </section>
            </div>
            <div class="actions">
                <button id="new-questions" type="button">Nous exercicis</button>
                <button id="print-worksheet" type="button">Imprimeix</button>
            </div>
        </main>
        <footer>
            <a href="https://github.com/ignasi35/deures/">Repositori del projecte</a>
            <span> · Continguts amb llicència <a href="https://creativecommons.org/licenses/by-sa/4.0/">CC BY-SA 4.0</a>.</span>
        </footer>
        <script src="comarques.js"></script>
        <script>
            const fields = ["name", "capital", "number"];
            const fieldLabels = {
                name: "Comarca",
                capital: "Capital",
                number: "Número"
            };
            const comarcaData = comarques.map(([name, capital], index) => ({
                name,
                capital,
                number: index + 1
            }));
            const questions = document.querySelector("#questions");
            const quizTitle = document.querySelector("#quiz-title");
            const quizInstructions = document.querySelector("#quiz-instructions");
            const questionHeadings = document.querySelector("#question-headings");

            function shuffle(items) {
                for (let index = items.length - 1; index > 0; index -= 1) {
                    const randomIndex = Math.floor(Math.random() * (index + 1));
                    [items[index], items[randomIndex]] = [items[randomIndex], items[index]];
                }
                return items;
            }

            function createQuestions() {
                const promptField = fields[Math.floor(Math.random() * fields.length)];
                const answerFields = fields.filter((field) => field !== promptField);
                const prompts = shuffle([...comarcaData]).slice(0, 18);

                const clueDescription = {
                    name: "del nom",
                    capital: "de la capital",
                    number: "del número"
                };
                quizTitle.textContent = `A partir ${clueDescription[promptField]}, completa les altres dades`;
                quizInstructions.textContent = "Cada fila mostra només una dada de la comarca. Escriu les altres dues.";
                questionHeadings.replaceChildren();
                fields.forEach((field) => {
                    const heading = document.createElement("span");
                    heading.textContent = fieldLabels[field];
                    questionHeadings.append(heading);
                });
                questions.replaceChildren();
                prompts.forEach((comarca) => {
                    const question = document.createElement("li");
                    fields.forEach((field) => {
                        if (field === promptField) {
                            const prompt = document.createElement("span");
                            prompt.textContent = comarca[field];
                            question.append(prompt);
                            return;
                        }

                        const answer = document.createElement("span");
                        answer.className = "answer-space";
                        answer.setAttribute("aria-label", fieldLabels[field]);
                        question.append(answer);
                    });
                    questions.append(question);
                });
            }

            document.querySelector("#new-questions").addEventListener("click", createQuestions);
            document.querySelector("#print-worksheet").addEventListener("click", () => window.print());
            createQuestions();
        </script>
    </body>
</html>
