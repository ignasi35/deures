<!doctype html>
<html lang="ca">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Comarques de Catalunya</title>
        <style>
            body {
                color: #222;
                font-family: Arial, sans-serif;
                line-height: 1.45;
                margin: 2rem auto;
                max-width: 74rem;
                padding: 0 1rem;
            }

            h1 {
                margin-bottom: 0.25rem;
            }

            .instructions {
                margin-top: 0;
            }

            .worksheet {
                align-items: start;
                display: grid;
                gap: 1.5rem;
                grid-template-columns: minmax(0, 1.5fr) minmax(16rem, 0.8fr);
            }

            figure {
                margin: 0;
            }

            .map-container {
                position: relative;
            }

            .map {
                display: block;
                height: auto;
                width: 100%;
            }

            #letter-labels {
                display: none;
                height: 100%;
                inset: 0;
                pointer-events: none;
                position: absolute;
                width: 100%;
            }

            .worksheet[data-mode="letters"] #letter-labels {
                display: block;
            }

            figcaption {
                color: #555;
                font-size: 0.8rem;
                margin-top: 0.5rem;
            }

            h2 {
                font-size: 1.2rem;
                margin: 0 0 0.75rem;
            }

            #question-headings,
            #questions li {
                display: grid;
                gap: 0.5rem;
                grid-template-columns: minmax(0, 1.3fr) minmax(0, 1.5fr) minmax(3rem, 0.45fr);
            }

            #question-headings.letter-mode,
            #questions li.letter-mode {
                grid-template-columns: 1.5rem minmax(0, 1fr) minmax(0, 1fr);
            }

            #question-headings {
                font-size: 0.8rem;
                font-weight: 700;
                margin-bottom: 0.5rem;
            }

            #questions {
                display: grid;
                gap: 0.65rem;
                grid-template-columns: minmax(0, 1fr);
                list-style: none;
                margin: 0;
                padding: 0;
            }

            #questions li {
                align-items: end;
            }

            .answer-space {
                border-bottom: 1px solid #777;
                display: block;
                height: 1.3rem;
            }

            footer {
                font-size: 0.75rem;
                margin-top: 1rem;
            }

            .actions {
                display: flex;
                gap: 0.75rem;
                margin-top: 1.5rem;
            }

            button {
                cursor: pointer;
                font: inherit;
                padding: 0.5rem 1rem;
            }

            @media (max-width: 48rem) {
                .worksheet {
                    grid-template-columns: 1fr;
                }
            }

            @media print {
                @page {
                    size: A4 landscape;
                    margin: 10mm;
                }

                body {
                    color: #000;
                    font-size: 10pt;
                    margin: 0;
                    max-width: none;
                    padding: 0;
                }

                h1 {
                    font-size: 18pt;
                }

                .worksheet {
                    gap: 1rem;
                    grid-template-columns: minmax(0, 1.5fr) minmax(0, 0.8fr);
                }

                .map-container {
                    margin: 0 auto;
                    width: 90%;
                }

                .map {
                    width: 100%;
                }

                #questions {
                    gap: 0.35rem;
                }

                #question-headings {
                    margin-bottom: 0.3rem;
                }

                #questions li {
                    break-inside: avoid;
                }

                .actions {
                    display: none;
                }

                .index-link {
                    display: none;
                }

                footer {
                    font-size: 7pt;
                    margin-top: 0.5rem;
                }

                figcaption {
                    font-size: 7pt;
                }

                .full-list-link,
                .map-link {
                    display: none;
                }
            }
        </style>
    </head>
    <body>
        <main>
            <p class="index-link"><a href="../index.html">Torna a l’índex</a></p>
            <h1>Comarques de Catalunya</h1>
            <p class="instructions" id="quiz-instructions"></p>
            <p class="full-list-link"><a href="llistat.html">llistat complert</a></p>
            <p class="map-link"><a href="mapa.html">Mapa per imprimir</a></p>
            <div class="worksheet">
                <figure>
                    <div class="map-container">
                        <img
                            class="map"
                            id="comarques-map"
                            src="comarques-catalunya-map.svg"
                            alt="Mapa de Catalunya amb els límits de les 43 comarques, cadascuna identificada amb un número."
                        >
                        <svg id="letter-labels" viewBox="0 0 800 720" aria-hidden="true"></svg>
                    </div>
                    <figcaption>
                        Límits comarcals basats en dades de la Generalitat de Catalunya,
                        distribuïdes pel projecte
                        <a href="https://github.com/psauleda/Comarques-de-Catalunya">Comarques de Catalunya</a>.
                    </figcaption>
                </figure>
                <section aria-labelledby="quiz-title">
                    <h2 id="quiz-title"></h2>
                    <div id="question-headings"></div>
                    <ol id="questions"></ol>
                </section>
            </div>
            <div class="actions">
                <button id="new-questions" type="button">Nous exercicis</button>
                <button id="print-worksheet" type="button">Imprimeix</button>
            </div>
        </main>
        <footer>
            <a href="https://github.com/ignasi35/deures/">Repositori del projecte</a>
            <span> · Continguts amb llicència <a href="https://creativecommons.org/licenses/by-sa/4.0/">CC BY-SA 4.0</a>.</span>
        </footer>
        <script src="comarques.js"></script>
        <script>
            const fields = ["name", "capital", "number"];
            const fieldLabels = {
                name: "Comarca",
                capital: "Capital",
                number: "Número"
            };
            const comarcaData = comarques.map(([name, capital], index) => ({
                name,
                capital,
                number: index + 1
            }));
            const questions = document.querySelector("#questions");
            const quizTitle = document.querySelector("#quiz-title");
            const quizInstructions = document.querySelector("#quiz-instructions");
            const questionHeadings = document.querySelector("#question-headings");
            const worksheet = document.querySelector(".worksheet");
            const map = document.querySelector("#comarques-map");
            const letterLabels = document.querySelector("#letter-labels");
            const letters = "abcdefghijklmnopqr";
            const svgNamespace = "http://www.w3.org/2000/svg";
            const mapMarkers = [
                [307.9, 467.1, "#F4A098"], [657.0, 182.1, "#64933D"], [387.0, 446.3, "#FFD166"],
                [326.5, 186.6, "#65ADE8"], [208.9, 121.1, "#65ADE8"], [360.7, 388.8, "#FFD166"],
                [401.1, 338.0, "#FFD166"], [249.4, 503.7, "#F4A098"], [138.1, 598.2, "#F4A098"],
                [684.7, 287.3, "#64933D"], [452.7, 458.3, "#FFD166"], [350.1, 474.0, "#F4A098"],
                [488.4, 439.0, "#FFD166"], [424.6, 252.3, "#FFD166"], [406.6, 160.8, "#64933D"],
                [270.0, 445.8, "#F4A098"], [411.8, 477.6, "#FFD166"], [213.8, 425.0, "#65ADE8"],
                [564.2, 222.4, "#64933D"], [629.6, 280.0, "#64933D"], [468.3, 271.9, "#FFD166"],
                [599.6, 365.9, "#FFD166"], [476.0, 336.5, "#FFD166"], [134.9, 654.6, "#F4A098"],
                [203.4, 304.6, "#65ADE8"], [515.9, 293.2, "#FFD166"], [233.4, 226.0, "#65ADE8"],
                [285.0, 108.6, "#65ADE8"], [219.0, 372.1, "#65ADE8"], [622.8, 237.6, "#64933D"],
                [201.5, 486.6, "#F4A098"], [174.1, 549.9, "#F4A098"], [500.3, 186.8, "#64933D"],
                [304.3, 365.6, "#65ADE8"], [153.9, 380.6, "#65ADE8"], [585.9, 320.2, "#64933D"],
                [350.8, 259.8, "#65ADE8"], [308.2, 506.8, "#F4A098"], [111.1, 532.1, "#F4A098"],
                [258.3, 391.2, "#65ADE8"], [204.0, 67.9, "#65ADE8"], [468.0, 401.3, "#FFD166"],
                [526.5, 362.4, "#FFD166"]
            ];

            function shuffle(items) {
                for (let index = items.length - 1; index > 0; index -= 1) {
                    const randomIndex = Math.floor(Math.random() * (index + 1));
                    [items[index], items[randomIndex]] = [items[randomIndex], items[index]];
                }
                return items;
            }

            function createClueQuestions() {
                worksheet.dataset.mode = "clues";
                map.alt = "Mapa de Catalunya amb els límits de les 43 comarques, cadascuna identificada amb un número.";
                letterLabels.replaceChildren();
                const promptField = fields[Math.floor(Math.random() * fields.length)];
                const answerFields = fields.filter((field) => field !== promptField);
                const prompts = shuffle([...comarcaData]).slice(0, 18);

                const clueDescription = {
                    name: "del nom",
                    capital: "de la capital",
                    number: "del número"
                };
                quizTitle.textContent = `A partir ${clueDescription[promptField]}, completa les altres dades`;
                quizInstructions.textContent = "Cada fila mostra només una dada de la comarca. Escriu les altres dues.";
                questionHeadings.replaceChildren();
                questionHeadings.classList.remove("letter-mode");
                fields.forEach((field) => {
                    const heading = document.createElement("span");
                    heading.textContent = fieldLabels[field];
                    questionHeadings.append(heading);
                });
                questions.replaceChildren();
                prompts.forEach((comarca) => {
                    const question = document.createElement("li");
                    fields.forEach((field) => {
                        if (field === promptField) {
                            const prompt = document.createElement("span");
                            prompt.textContent = comarca[field];
                            question.append(prompt);
                            return;
                        }

                        const answer = document.createElement("span");
                        answer.className = "answer-space";
                        answer.setAttribute("aria-label", fieldLabels[field]);
                        question.append(answer);
                    });
                    questions.append(question);
                });
            }

            function createLetterQuestions() {
                worksheet.dataset.mode = "letters";
                map.alt = "Mapa de Catalunya sense números, amb 18 comarques identificades amb lletres.";
                quizTitle.textContent = "Escriu el nom de cada comarca i la seva capital";
                quizInstructions.textContent = "Identifica al mapa les 18 comarques marcades amb lletres i completa'n el nom i la capital.";
                questionHeadings.replaceChildren();
                questionHeadings.classList.add("letter-mode");
                [".", "Comarca", "Capital"].forEach((label) => {
                    const heading = document.createElement("span");
                    heading.textContent = label;
                    questionHeadings.append(heading);
                });

                const prompts = shuffle([...comarcaData]).slice(0, letters.length);
                letterLabels.replaceChildren();
                mapMarkers.forEach(([x, y, fill]) => {
                    const cover = document.createElementNS(svgNamespace, "circle");
                    cover.setAttribute("cx", String(x));
                    cover.setAttribute("cy", String(y));
                    cover.setAttribute("r", "14");
                    cover.setAttribute("fill", fill);
                    letterLabels.append(cover);
                });
                prompts.forEach((comarca, index) => {
                    const letter = letters[index];
                    const [x, y] = mapMarkers[comarca.number - 1];
                    const marker = document.createElementNS(svgNamespace, "g");
                    const circle = document.createElementNS(svgNamespace, "circle");
                    const label = document.createElementNS(svgNamespace, "text");
                    circle.setAttribute("cx", String(x));
                    circle.setAttribute("cy", String(y));
                    circle.setAttribute("r", "13");
                    circle.setAttribute("fill", "#fff");
                    circle.setAttribute("stroke", "#263746");
                    circle.setAttribute("stroke-width", "1.2");
                    label.setAttribute("x", String(x));
                    label.setAttribute("y", String(y + 4.5));
                    label.setAttribute("text-anchor", "middle");
                    label.setAttribute("font-family", "Arial, sans-serif");
                    label.setAttribute("font-size", "14");
                    label.setAttribute("font-weight", "700");
                    label.setAttribute("fill", "#172b3a");
                    label.textContent = letter;
                    marker.append(circle, label);
                    letterLabels.append(marker);
                });

                questions.replaceChildren();
                prompts.forEach((comarca, index) => {
                    const question = document.createElement("li");
                    const letter = document.createElement("span");
                    letter.textContent = letters[index];
                    question.classList.add("letter-mode");
                    question.append(letter);
                    ["name", "capital"].forEach((field) => {
                        const answer = document.createElement("span");
                        answer.className = "answer-space";
                        answer.setAttribute("aria-label", fieldLabels[field]);
                        question.append(answer);
                    });
                    questions.append(question);
                });
            }

            function createQuestions() {
                if (Math.random() < 0.5) {
                    createLetterQuestions();
                    return;
                }
                createClueQuestions();
            }

            document.querySelector("#new-questions").addEventListener("click", createQuestions);
            document.querySelector("#print-worksheet").addEventListener("click", () => window.print());
            createQuestions();
        </script>
    </body>
</html>
