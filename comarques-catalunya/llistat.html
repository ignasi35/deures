<!doctype html>
<html lang="ca">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Llistat complet de comarques de Catalunya</title>
        <style>
            body {
                color: #222;
                font-family: Arial, sans-serif;
                line-height: 1.4;
                margin: 2rem auto;
                max-width: 74rem;
                padding: 0 1rem;
            }

            h1 {
                font-size: 1.8rem;
                margin-bottom: 0.75rem;
            }

            .worksheet {
                align-items: start;
                display: grid;
                gap: 1.5rem;
                grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr);
            }

            .maps {
                display: grid;
                gap: 1rem;
            }

            figure {
                margin: 0;
            }

            .map-container {
                position: relative;
            }

            .map {
                display: block;
                height: auto;
                width: 100%;
            }

            #map-labels {
                display: block;
                height: 100%;
                inset: 0;
                pointer-events: none;
                position: absolute;
                width: 100%;
            }

            figcaption {
                color: #555;
                font-size: 0.75rem;
                margin-top: 0.4rem;
            }

            table {
                border-collapse: collapse;
                width: 100%;
            }

            th,
            td {
                border-bottom: 1px solid #bbb;
                padding: 0.2rem 0.4rem;
                text-align: left;
            }

            th:first-child,
            td:first-child {
                text-align: right;
                width: 2.5rem;
            }

            .province-heading th {
                background: #f0f0f0;
                padding-top: 0.45rem;
                text-align: left;
            }

            footer {
                font-size: 0.75rem;
                margin-top: 1rem;
            }

            @media (max-width: 48rem) {
                .worksheet {
                    grid-template-columns: 1fr;
                }
            }

            @media print {
                @page {
                    size: A4 landscape;
                    margin: 8mm;
                }

                body {
                    color: #000;
                    font-size: 8pt;
                    line-height: 1.15;
                    margin: 0;
                    max-width: none;
                    padding: 0;
                }

                h1 {
                    font-size: 16pt;
                    margin: 0 0 0.5rem;
                }

                .index-link,
                .actions {
                    display: none;
                }

                .worksheet {
                    gap: 5mm;
                    grid-template-columns: minmax(0, 1.1fr) minmax(0, 0.9fr);
                }

                .maps {
                    gap: 2mm;
                }

                .map {
                    max-height: 83mm;
                    width: 100%;
                }

                figcaption {
                    font-size: 6pt;
                    margin-top: 1mm;
                }

                th,
                td {
                    padding: 1mm 2mm;
                }

                footer {
                    font-size: 6pt;
                    margin-top: 2mm;
                }
            }
        </style>
    </head>
    <body>
        <main>
            <p class="index-link"><a href="index.html">Torna als deures de comarques</a></p>
            <p class="index-link"><a href="mapa.html">Mapa per imprimir</a></p>
            <h1>Llistat complet de comarques de Catalunya</h1>
            <div class="worksheet">
                <div class="maps">
                    <figure>
                        <div class="map-container">
                            <img
                                class="map"
                                src="comarques-catalunya-map.svg"
                                alt="Mapa de Catalunya amb els límits de les comarques, sense números."
                            >
                        </div>
                    </figure>
                    <figure>
                        <div class="map-container">
                            <img
                                id="exercise-map"
                                class="map"
                                src="comarques-catalunya-map.svg"
                                alt="Mapa de Catalunya amb les 43 comarques identificades amb números."
                            >
                            <svg id="map-labels" aria-hidden="true"></svg>
                        </div>
                        <figcaption>
                            Límits comarcals basats en dades de la Generalitat de Catalunya,
                            distribuïdes pel projecte
                            <a href="https://github.com/psauleda/Comarques-de-Catalunya">Comarques de Catalunya</a>.
                        </figcaption>
                    </figure>
                </div>
                <table>
                    <thead>
                        <tr>
                            <th scope="col">Número</th>
                            <th scope="col">Comarca</th>
                            <th scope="col">Capital</th>
                        </tr>
                    </thead>
                    <tbody id="comarca-list"></tbody>
                </table>
            </div>
            <div class="actions">
                <button id="print-list" type="button">Imprimeix</button>
            </div>
        </main>
        <footer>
            <a href="https://github.com/ignasi35/deures/">Repositori del projecte</a>
            <span> · Continguts amb llicència <a href="https://creativecommons.org/licenses/by-sa/4.0/">CC BY-SA 4.0</a>.</span>
        </footer>
        <script src="comarques.js"></script>
        <script src="../geografia/mapa-numerat.js"></script>
        <script>
            const comarcaList = document.querySelector("#comarca-list");

            const provinceGroups = ["Barcelona", "Girona", "Lleida", "Tarragona"];
            provinceGroups.forEach((province) => {
                const heading = document.createElement("tr");
                heading.className = "province-heading";
                const headingCell = document.createElement("th");
                headingCell.scope = "rowgroup";
                headingCell.colSpan = 3;
                headingCell.textContent = province;
                heading.append(headingCell);
                comarcaList.append(heading);

                window.geographyExercise.entries
                    .filter((entry) => entry.province === province)
                    .forEach((entry) => {
                        const row = document.createElement("tr");
                        row.className = "comarca-row";
                        const number = window.geographyExercise.entries.indexOf(entry) + 1;
                        [number, entry.name, entry.capital].forEach((value) => {
                            const cell = document.createElement("td");
                            cell.textContent = String(value);
                            row.append(cell);
                        });
                        comarcaList.append(row);
                    });
            });

            document.querySelector("#print-list").addEventListener("click", () => window.print());
        </script>
    </body>
</html>
